workflows:
  ios-zh:
    name: Generals Zero Hour iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      groups:
        - app_store_connect
      vars:
        GX_BUNDLE_ID: me.ammaar.generalszh

    scripts:
      - name: Install build tools
        script: |
          brew install cmake ninja xcodegen

      - name: Initialize submodules
        script: |
          git submodule update --init --recursive

      - name: Fetch MoltenVK
        script: |
          chmod +x scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Build iOS Vulkan engine
        script: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals --parallel

      - name: Package iOS app
        script: |
          chmod +x scripts/build/ios/package-ios-zh.sh
          ./scripts/build/ios/package-ios-zh.sh --dev

      - name: Create IPA
        script: |
          mkdir -p Payload
          cp -R build/ios-package/GeneralsXZH.app Payload/
          /usr/bin/zip -r GeneralsXZH.ipa Payload

    artifacts:
      - GeneralsXZH.ipa
      - build/ios-package/GeneralsXZH.app/**
